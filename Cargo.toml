[package]
name = "brain-dump-vercel"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "entries"
path = "api/entries.rs"

[dependencies]
vercel_runtime = "1.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"